<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pokémon Web Emulator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav>
    <button onclick="showTab('play')">Play</button>
    <button onclick="showTab('harbour')">Harbour</button>
    <button onclick="showTab('upload')">Upload</button>
    <button onclick="showTab('library')">Library</button>
  </nav>

  <!-- Tabs -->
  <div id="play" class="tab-content">
    <h2>Emulator</h2>
    <p>Game screen will load here.</p>
    <button onclick="saveState('currentGame','exampleSaveData')">Save</button>
    <button onclick="alert(loadState('currentGame'))">Load</button>
  </div>

  <div id="harbour" class="tab-content" style="display:none;">
    <h2>Poké Harbour</h2>
    <p>Browse and download ROMs.</p>
    <h3>Standard Harbour</h3>
    <p>Normal-sized ROMs listed here.</p>
    <h3>Giga Section</h3>
    <p>High-MB ROMs listed here.</p>
  </div>

  <div id="upload" class="tab-content" style="display:none;">
    <h2>Upload Game</h2>
    <input type="file" id="romUpload">
    <button onclick="saveGameToLibrary('UploadedGame','initialData')">Upload</button>
  </div>

  <div id="library" class="tab-content" style="display:none;">
    <h2>Library</h2>
    <p>Your uploaded games will appear here.</p>
    <div id="libraryList"></div>
  </div>

  <!-- Script -->
  <script src="scripts.js"></script>
</body>
</html>
